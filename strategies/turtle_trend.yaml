instructions: |
  **海龟顺势与资金控管策略（Turtle Trend & Money Management）**

  核心哲学（书目提炼）：
  - **顺势而为，不预测只跟随（海龟）**：趋势形成后跟随，不猜顶猜底。
  - **截断亏损、让利润奔跑（李佛摩）**：错了快认错，对了让盈利单跑完。
  - **系统化纪律（海龟）**：入场、加码、止损、离场全部规则化，不靠盘感即兴。
  - **绝不向下摊平亏损（李佛摩）**：亏损单不加仓，只加码正在盈利的强势方向。

  ## 系统信号

  ### 第一步：唐奇安通道突破（入场 / 离场）
  使用 `get_daily_history` 计算区间高低点：
  - **短系统**：突破近 20 日最高价入场；跌破近 10 日最低价离场。
  - **长系统**：突破近 55 日最高价入场；跌破近 20 日最低价离场。
  - 只做向上突破的多头方向，配合 `analyze_trend` 确认多头排列（MA5 > MA10 > MA20）。

  ### 第二步：波动率与仓位（N = ATR）
  - 用近 20 日 ATR 作为波动单位 N，度量该股每日波动幅度。
  - 单笔风险约为账户资金的 1%：`头寸规模 ≈ (账户资金 × 1%) / (N × 每点价值)`。
  - **波动越大（N 越大），仓位越小**；以风险而非金额决定买多少。

  ### 第三步：硬止损（2N）
  - 止损固定设在 `入场价 - 2N`。
  - 触及止损立即离场，不容情、不侥幸、不移动止损扩大亏损。

  ### 第四步：金字塔加码（顺势放大盈利）
  - 每上涨 0.5N 加一个单位，最多 3~4 个单位。
  - 每次加码后，整体止损同步上移，保护已有利润。
  - 只加码盈利方向，绝不对亏损单摊平。

  ### 第五步：李佛摩关键点（Pivotal Point）
  - 只在关键价位方向明确突破后进场，避开震荡区反复被扫。
  - 顺应最小阻力线（大趋势）方向；判断错误就立刻退出，而不是找理由死扛。

  ## 台股潜力筛选提示（供后续「猎股」清单使用）
  用于台股潜力罗列时，本策略负责「趋势动能潜力」维度：筛选**刚突破 20/55 日高、量能放大、ATR 适中（非单日暴涨透支）**且多头排列的台股，并标注突破点、N 值与建议止损位，便于清单按动能排序与风险控制。

  ## 买入基准
  同时满足：
  - 价格有效突破唐奇安上轨（20 或 55 日高）。
  - 多头排列成立，量能配合放大（量价配合）。
  - 突破点乖离可控，仓位按 N 计算，明确 2N 止损位。

  ## 卖出基准
  出现任一：
  - 跌破对应离场通道（10 或 20 日低）。
  - 触及 2N 硬止损。
  - 趋势转空、跌破关键点或均线转空头排列。

  ## 纪律禁令
  - 不追已远离突破点的高乖离追涨。
  - 不对亏损单摊平、不因情绪提前平掉盈利单。
  - 不在震荡区无关键点信号时反复进出。

  ## 评分调整建议
  - 有效唐奇安突破 + 量能配合 + 多头排列：`sentiment_score +16`
  - 首次突破、乖离小、止损风险可控：额外 `+8`
  - 高乖离追突破（已远离入场点）：`sentiment_score -10`
  - 跌破离场通道或触及止损：`sentiment_score -18`
  - 逆势 / 空头排列：判定为观望，不加分
