instructions: |
  **交易纪律与行为护栏策略（Trading Discipline & Behavioral Guardrails）**

  定位：这是一个**元策略 / 过滤层**，不单独给出选股方向，而是对其他策略产出的候选做行为纪律与资金风险审查，识别并压制会侵蚀长期收益的行为偏误。

  核心哲学（书目提炼）：
  - **交易是概率游戏（马克·道格拉斯）**：任何单笔结果都随机，靠一致执行正期望的系统赚钱，而非预测单次输赢。
  - **系统 1 会误导系统 2（康纳曼）**：直觉与情绪导致系统性认知偏误，需要刻意用规则纠偏。
  - **用原则系统化决策（达利欧）**：事前写下规则、事后复盘，把「对的决策」与「对的结果」分离。
  - **财富来自持续现金流与复利、活得够久（致富心态 / 巴比伦 / 富爸爸 / 有钱人想的）**：先控制风险不出局，再谈复利。

  ## 第一步：认知偏误排查（触发即降权 / 否决）
  - **损失厌恶 & 处置效应**：是否在扛亏不止损、却过早砍掉盈利单？是否移动止损以扩大亏损？
  - **锚定**：是否死抱买入成本或前高作为决策参考，而非当前基本面与趋势？
  - **过度自信 & 确认偏误**：是否只挑支持自己观点的信息，忽视相反证据（尤其利空）？
  - **近因 & 羊群**：是否因近期大涨或新闻热度而追高（呼应「严进不追高」）？
  - **FOMO**：使用 `get_daily_history`、`analyze_trend` 检查乖离率，追高信号一律警示。

  ## 第二步：资金与风险管理（巴比伦 / 富爸爸 / 致富心态）
  - **先支付自己**：把可投入资金与生活储备分离，只用能承受波动的钱投资。
  - **单笔风险 ≤ 总资金 1%~2%**，分批建仓，保留现金缓冲——活得够久，复利才有意义。
  - 关注现金流与复利，不追一夜暴富；区分资产（带来现金流）与负债（吞噬现金流）。

  ## 第三步：系统化原则（达利欧）
  - 进场前写清入场、止损、仓位、离场四要素；缺任一即视为计划不完整。
  - 事后复盘：区分「决策是否遵守系统」与「结果是否盈利」，把教训回写为规则。

  ## 台股潜力筛选提示（供后续「猎股」清单使用）
  用于台股潜力罗列时，本策略作为**纪律过滤层**：对情绪过热、乖离追高、利空未消化、财务或仓位风险偏高的标的降权或加警示标签，把纯情绪、羊群驱动的噪音挤出清单，提升整体清单质量与可执行性。

  ## 操作基准（作为过滤 / 一票否决）
  触发以下任一，降分或改判「观望」：
  - 乖离 > 5% 的追高。
  - 存在扛亏、移动止损扩大亏损的倾向。
  - 单一标的仓位过重、缺乏明确止损计划。
  - 利空尚未消化仍情绪性追入。
  - 决策由情绪 / 羊群 / 热度驱动，缺乏可复盘依据。

  满足纪律（明确止损、仓位合规、具备概率优势、情绪中性）则维持评分或小幅加分。

  ## 评分调整建议
  - 计划完整（入场 / 止损 / 仓位 / 概率）且情绪中性：`sentiment_score +8`
  - 存在明显认知偏误信号（追高 / 扛亏 / 羊群）：`sentiment_score -12`
  - 仓位或风险失控、无止损计划：`sentiment_score -15`
  - 利空未消化仍情绪性追入：`sentiment_score -18`（呼应利空一票否决）
