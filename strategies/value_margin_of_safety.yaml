instructions: |
  **价值与安全边际策略（Value & Margin of Safety）**

  核心哲学（书目提炼）：
  - **市场先生（葛拉汉）**：价格是情绪报价，价值才是锚。别被市场情绪牵着走，利用它的报错。
  - **安全边际（葛拉汉）**：只在价格明显低于内在价值时买入，用折价保护判断误差与运气。
  - **护城河与能力圈（巴菲特、晨星）**：只买自己看得懂、且具备长期竞争优势的好公司。
  - **从生活选股与分类（彼得林区）**：从可验证的真实需求出发，按公司类型套用不同买卖逻辑。

  适用场景：
  - 中长期持有、看重下行保护而非短线形态。
  - 震荡市、恐慌错杀、优质公司被错误定价时尤其有效。

  ## 分析框架

  ### 第一步：内在价值与安全边际估算
  使用 `get_stock_info`、`get_realtime_quote`：
  - 参考股东盈余 / 自由现金流、PE、PB、市值等估值字段，粗估内在价值区间。
  - 彼得林区 PEG：`PEG = PE / 盈利增长率`，PEG < 1 偏低估，> 1.5 偏贵。
  - 安全边际 = (内在价值 - 现价) / 内在价值；**要求 ≥ 25%~30% 才纳入价值潜力候选**。
  - 与自身历史估值区间、同业估值横向对比，判断是被错杀还是理应便宜。

  ### 第二步：护城河判定（可持续性）
  使用 `search_stock_news`、`get_stock_info`：
  - 检查五类护城河：无形资产 / 品牌、转换成本、网络效应、成本优势、有效规模。
  - 长期 ROE / ROIC 是否稳定高于资金成本，是宽护城河的量化侧证。
  - 判定：宽护城河 / 窄护城河 / 无护城河；无护城河的便宜要格外警惕价值陷阱。

  ### 第三步：财务安全（下行保护，葛拉汉防御型标准）
  - 负债率、流动比率、利息保障倍数；现金是否覆盖短期负债。
  - 高杠杆、现金 < 短债、经营现金流长期为负的公司，安全边际要打折。

  ### 第四步：彼得林区公司分类
  - 缓慢成长 / 稳健成长 / 快速成长 / 景气循环 / 转机 / 资产型，六类买卖逻辑不同：
    - 景气循环股在景气高点估值最低时最危险；转机股要等基本面确认拐点。
  - 用真实需求、门店 / 产品 / 产业观察验证成长逻辑，而非只看概念热度。

  ## 台股潜力筛选提示（供后续「猎股」清单使用）
  用于台股潜力罗列时，本策略负责「价值潜力」维度：优先列出**安全边际充足 + 宽/窄护城河 + 财务稳健**的标的，并标注估算内在价值区间与折价幅度，便于清单排序。

  ## 买入基准
  同时满足：
  - 现价 ≤ 内在价值 ×(1 - 安全边际)，折价 ≥ 25%~30%。
  - 具备宽或窄护城河，长期盈利能力可持续。
  - PEG < 1，或 PE/PB 低于自身历史与同业中枢。
  - 财务稳健：低杠杆、现金覆盖短债、现金流健康。
  - 当前利空为暂时性、非结构性（可利用市场先生错杀）。

  ## 卖出 / 回避基准
  出现任一：
  - 现价 ≥ 内在价值，安全边际消失（价格已反映价值）。
  - 护城河被侵蚀、竞争格局恶化、定价权下降。
  - 当初的价值逻辑被证伪（基本面结构性变坏）。
  - 财务显著恶化：杠杆飙升、现金流转差、偿债承压。
  - 出现明显更优的价值机会需要换仓。

  ## 输出要求
  - 明确标注：低估有边际 / 合理估值 / 高估 / 价值陷阱。
  - 说明折价来自市场错杀、周期低谷，还是基本面真实恶化。
  - 给出价值型买点：安全边际充足处分批建仓、回踩长期均线或估值回落至中枢下方。

  ## 评分调整建议
  - 安全边际 ≥ 30% 且具宽护城河：`sentiment_score +18`
  - 安全边际充足且财务安全全部满足：额外 `+12`
  - PEG < 1 且成长可验证：额外 `+8`
  - 无护城河或现价高于内在价值（缺乏边际）：`sentiment_score -12`
  - 高杠杆 / 现金 < 短债等财务风险：`sentiment_score -15`
  - 价值陷阱（便宜但基本面持续恶化）：`sentiment_score -10`
